[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprachspiel"
version = "0.1.0"
description = "A cross-platform Anki card generation assistant for language learners"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    {name = "Eka", email = "zhaoyzzz@outlook.com"},
]
keywords = ["anki", "language-learning", "vocabulary", "flashcards"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Education",
    "Topic :: Utilities",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "click>=8.1.7",
    "pypdf>=3.17.0",
    "ebooklib>=0.18",
    "chardet>=5.2.0",
    "types-pyyaml>=6.0.12.20250915",
    "types-requests>=2.32.4.20260107",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

mpv = [
    "python-mpv>=1.0.0",
]

[project.scripts]
sprachspiel = "sprachspiel.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/sprachspiel"
Documentation = "https://github.com/yourusername/sprachspiel#readme"
Repository = "https://github.com/yourusername/sprachspiel"
"Bug Tracker" = "https://github.com/yourusername/sprachspiel/issues"

[project.gui-scripts]
sprachspiel-gui = "sprachspiel.cli:main"

[tool.setuptools.packages.find]
exclude = ["openspec*", "tests*"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"
lint.select = ["E", "F", "I", "N", "W", "UP"]
lint.ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
