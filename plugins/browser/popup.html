<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      width: 320px;
      min-height: 200px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      font-size: 14px;
      color: #333;
    }
    h1 {
      margin: 0 0 16px 0;
      font-size: 18px;
      color: #2c3e50;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 16px;
    }
    .status.connected {
      background: #d4edda;
      color: #155724;
    }
    .status.disconnected {
      background: #f8d7da;
      color: #721c24;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .status.connected .status-dot {
      background: #28a745;
    }
    .status.disconnected .status-dot {
      background: #dc3545;
    }
    .input-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      font-weight: 500;
      color: #555;
    }
    input[type="text"],
    input[type="url"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
    }
    input[type="text"]:focus,
    input[type="url"]:focus {
      outline: none;
      border-color: #4a90d9;
    }
    .buttons {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    button {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.primary {
      background: #4a90d9;
      color: white;
    }
    button.primary:hover {
      background: #357abd;
    }
    button.secondary {
      background: #e9ecef;
      color: #555;
    }
    button.secondary:hover {
      background: #dee2e6;
    }
    .info {
      margin-top: 16px;
      padding: 10px;
      background: #e7f3ff;
      border-radius: 4px;
      font-size: 11px;
      color: #004085;
      line-height: 1.4;
    }
    .word-display {
      padding: 12px;
      background: #f8f9fa;
      border-radius: 4px;
      margin-bottom: 12px;
      font-size: 16px;
      font-weight: 500;
      text-align: center;
      color: #2c3e50;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <h1>Sprachspiel</h1>

  <div id="status" class="status disconnected">
    <span class="status-dot"></span>
    <span id="status-text">Disconnected</span>
  </div>

  <div class="word-display" id="selected-word">
    Select text on any page
  </div>

  <div class="input-group">
    <label for="server-url">Sprachspiel Server URL</label>
    <input type="url" id="server-url" value="http://localhost:8000" placeholder="http://localhost:8000">
  </div>

  <div class="input-group">
    <label for="api-key">API Key (optional)</label>
    <input type="text" id="api-key" placeholder="Enter API key if required">
  </div>

  <div class="buttons">
    <button class="secondary" id="btn-settings">Settings</button>
    <button class="primary" id="btn-send" disabled>Send Word</button>
  </div>

  <div class="info">
    <strong>Tip:</strong> Select text on any webpage, right-click, and choose "Send to Sprachspiel" or use the keyboard shortcut Ctrl+Shift+S (Cmd+Shift+S on Mac).
  </div>

  <script src="popup.js"></script>
</body>
</html>
